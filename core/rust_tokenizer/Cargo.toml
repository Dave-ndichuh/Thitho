[package]
name = "thitho-tokenizer"
version = "0.1.0"
edition = "2021"
description = "High-performance native Rust tokenizer for the Gikuyu language"
authors = ["Thitho Ecosystem Maintainers"]
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
unicode-normalization = "0.1"
